name: Deploy Cloudflare Worker

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment to deploy
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Enforce dependency security policy
        run: npm run audit:security
      - name: Set build-time public URLs
        run: |
          if [ "$DEPLOY_ENV" = "production" ]; then
            printf '%s\n' \
              'NEXT_PUBLIC_SITE_URL=https://cbp.proneurs.org' \
              'NEXT_PUBLIC_MARKETING_URL=https://cbp.proneurs.org' \
              'NEXT_PUBLIC_TENANT_BASE_DOMAIN=cbp.proneurs.org' \
              'NEXT_PUBLIC_PRIMARY_DOMAIN=cbp.proneurs.org' >> "$GITHUB_ENV"
          else
            printf '%s\n' \
              'NEXT_PUBLIC_SITE_URL=https://proneurs-personal-cbp-sites-staging.mtheoford.workers.dev' \
              'NEXT_PUBLIC_MARKETING_URL=https://proneurs-personal-cbp-sites-staging.mtheoford.workers.dev' \
              'NEXT_PUBLIC_TENANT_BASE_DOMAIN=cbp.proneurs.org' \
              'NEXT_PUBLIC_PRIMARY_DOMAIN=proneurs-personal-cbp-sites-staging.mtheoford.workers.dev' >> "$GITHUB_ENV"
          fi
      - name: Build Worker
        run: npm run build:worker
      - name: Verify Worker secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          configured_secrets="$(npx wrangler secret list --env "$DEPLOY_ENV" | jq -r '.[].name')"
          for secret_name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_MONTHLY STRIPE_PRICE_ANNUAL RESEND_API_KEY ADMIN_EMAILS CF_ACCESS_AUD CF_ACCESS_TEAM_DOMAIN; do
            if ! grep -Fxq "$secret_name" <<< "$configured_secrets"; then
              echo "Missing required Worker secret: $secret_name" >&2
              exit 1
            fi
          done
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --env "$DEPLOY_ENV" --remote
      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx opennextjs-cloudflare deploy -- --env "$DEPLOY_ENV" --keep-vars
